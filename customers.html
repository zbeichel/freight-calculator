<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Customers — QuickFreightCalc</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/tools.css">
<script src="/site.js"></script>
<style>
/* The page title, cards and colors come from tools.css and site.css; the navigation and
   the footer from site.js. */
.page{max-width:1100px;margin:0 auto;padding:0 24px 64px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--border)}
.search{flex:1;min-width:200px;max-width:380px;background:var(--card2);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);
  font-family:inherit;font-size:14px;padding:10px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
.search::placeholder{color:var(--text3)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,165,0,.1)}
.toolbar .spacer{flex:1}
.btn{font-family:inherit;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.primary:hover{opacity:.9;color:var(--accent-ink)}
.btn:disabled{opacity:.6;cursor:default}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.list-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th.num,td.num{text-align:right}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--accentbg)}
tbody td{padding:11px 14px;vertical-align:middle}
.c-name{font-weight:700;color:var(--text);overflow-wrap:anywhere}
.c-sub{font-size:11px;color:var(--text3);margin-top:2px;overflow-wrap:anywhere}
.dim{color:var(--text3)}
.won{color:var(--green)}
.lost{color:var(--red)}
.edit{font-family:inherit;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer}
.edit:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:36px 24px;text-align:center;font-size:13px;color:var(--text3);line-height:1.7}
.empty strong{color:var(--text)}
.gate{margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 28px;max-width:620px;box-shadow:var(--shadow)}
.gate h2{font-size:17px;font-weight:700;margin-bottom:8px}
.gate p{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.gate ul{font-size:13px;color:var(--text2);line-height:1.8;margin:0 0 18px 18px}
.status{font-size:12px;color:var(--text3);margin-top:10px;min-height:16px}
[hidden]{display:none!important}
@media (max-width:740px){
  .page{padding:0 12px 56px}
  .hide-sm{display:none}
  .toolbar{padding:12px 14px}
  .search{max-width:none;font-size:16px}
  .toolbar .spacer{display:none}
}
</style>
</head>
<body>

<section class="hero">
  <span class="qf-pill">Customers · Pro Plus</span>
  <h1>Save your <em>customers</em> once</h1>
  <p class="hero-sub">Pick them on the calculator, multi-stop or bulk page and their contact details print under “Prepared for” on your PDF quotes. Win/loss results show for each customer.</p>
</section>

<main class="page">
  <div id="gate" class="gate" hidden></div>

  <div id="app" hidden>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Your customers</span>
        <span id="count" class="card-meta"></span>
      </div>
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Search by name, contact or email" autocomplete="off" aria-label="Search customers" />
        <span class="spacer"></span>
        <button id="import-btn" class="btn" hidden></button>
        <button id="add-btn" class="btn primary">+ New customer</button>
      </div>
      <div class="list-wrap">
        <table>
          <thead>
            <tr>
              <th>Customer</th>
              <th class="hide-sm">Contact</th>
              <th class="num">Quotes</th>
              <th class="num hide-sm">Won</th>
              <th class="num hide-sm">Lost</th>
              <th class="num">Win rate</th>
              <th class="hide-sm">Last quote</th>
              <th class="num hide-sm" title="Default margin, set when you pick this customer on the calculator">Margin</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden></div>
    </div>
    <div id="status" class="status" role="status"></div>
  </div>
</main>

<footer data-qf-footer></footer>

<script src="/customers.js"></script>
<script>
const SUPABASE_URL = 'https://xgrmbhmgcsbnazupfybd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zSa4XpzakcntdkZfTzUPlg_FigYcISZ';
let quotes = [];   // saved quotes: customer, customer_id, outcome, created_at
let query = '';

const esc = (s) => (s === null || s === undefined ? '' : String(s))
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const key = (s) => String(s || '').trim().replace(/\s+/g, ' ').toLowerCase();

function session(){
  const keys = Object.keys(localStorage).filter((k) => k.indexOf('sb-') === 0).concat('qfc_session');
  for(const k of keys){
    try { const v = JSON.parse(localStorage.getItem(k) || '{}'); if(v && v.access_token) return v; } catch(e){}
  }
  return null;
}

// ── Saved quotes, for each customer's numbers ──
async function loadQuotes(){
  const s = session();
  const uid = s && s.user && (s.user.id || s.user.sub);
  if(!uid) return;
  let rows = [];
  for(let offset = 0; offset < 5000; offset += 1000){
    // The access rules return this account's quotes (the team's, for a team member)
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/quote_log?select=id,customer,customer_id,outcome,created_at&order=created_at.desc&limit=1000&offset=${offset}`,
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token } });
    const page = await resp.json();
    if(!Array.isArray(page)) break;
    rows = rows.concat(page);
    if(page.length < 1000) break;
  }
  quotes = rows;
}

// A customer's saved quotes: linked to it, or carrying its name.
function statsFor(c){
  const k = key(c.name);
  const list = quotes.filter((q) => q.customer_id ? String(q.customer_id) === String(c.id) : key(q.customer) === k);
  const won = list.filter((q) => q.outcome === 'won').length;
  const lost = list.filter((q) => q.outcome === 'lost').length;
  return { quotes: list.length, won, lost, winRate: won + lost ? won / (won + lost) : null, last: list.length ? list[0].created_at : null };
}

// Names on saved quotes that aren't in the list yet (first spelling wins).
function unlistedNames(){
  const seen = new Set();
  const names = [];
  quotes.forEach((q) => {
    const k = key(q.customer);
    if(!k || q.customer_id || seen.has(k) || QFCCustomers.byName(q.customer)) return;
    seen.add(k);
    names.push(String(q.customer).trim().replace(/\s+/g, ' '));
  });
  return names;
}

function render(){
  const all = QFCCustomers.all();
  const k = key(query);
  const list = k ? all.filter((c) => [c.name, c.contactName, c.email, c.phone].some((v) => key(v).includes(k))) : all;
  document.getElementById('count').textContent =
    `${all.length.toLocaleString()} / ${QFCCustomers.limit().toLocaleString()} customers`;

  const names = unlistedNames();
  const imp = document.getElementById('import-btn');
  imp.hidden = !names.length;
  imp.textContent = `Add ${names.length.toLocaleString()} from saved quotes`;
  imp.title = names.slice(0, 12).join(', ') + (names.length > 12 ? '…' : '');

  const date = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  document.getElementById('rows').innerHTML = list.map((c) => {
    const st = statsFor(c);
    const sub = [c.email, c.phone].filter(Boolean).join(' · ');
    return `<tr data-id="${esc(c.id)}">
      <td><div class="c-name">${esc(c.name)}</div>${sub ? `<div class="c-sub">${esc(sub)}</div>` : ''}</td>
      <td class="hide-sm">${c.contactName ? esc(c.contactName) : '<span class="dim">—</span>'}</td>
      <td class="num">${st.quotes.toLocaleString()}</td>
      <td class="num won hide-sm">${st.won.toLocaleString()}</td>
      <td class="num lost hide-sm">${st.lost.toLocaleString()}</td>
      <td class="num"><strong>${st.winRate === null ? '<span class="dim">—</span>' : Math.round(st.winRate * 100) + '%'}</strong></td>
      <td class="hide-sm dim">${date(st.last)}</td>
      <td class="num hide-sm">${c.defaultMargin === null ? '<span class="dim">—</span>' : esc(c.defaultMargin) + '%'}</td>
      <td class="num"><button class="edit" type="button">Edit</button></td>
    </tr>`;
  }).join('');

  const empty = document.getElementById('empty');
  if(!all.length){
    empty.innerHTML = names.length
      ? `No customers saved yet. Your saved quotes name <strong>${names.length.toLocaleString()}</strong>; add them all with <strong>Add from saved quotes</strong>, or add one with <strong>+ New customer</strong>.`
      : 'No customers saved yet. Add one with <strong>+ New customer</strong>, or save one from the Customer box on the calculator.';
  } else if(!list.length){
    empty.textContent = `No customers match “${query.trim()}”.`;
  } else {
    empty.textContent = '';
  }
  empty.hidden = !empty.textContent;
}

async function importFromQuotes(){
  const names = unlistedNames();
  if(!names.length) return;
  const room = QFCCustomers.limit() - QFCCustomers.all().length;
  const take = names.slice(0, Math.max(0, room));
  if(!take.length){ setStatus("You've saved as many customers as your plan allows."); return; }
  if(!confirm(`Add ${take.length.toLocaleString()} customer${take.length === 1 ? '' : 's'} from your saved quotes? You can add contact details to each afterwards.`)) return;
  const btn = document.getElementById('import-btn');
  btn.disabled = true;
  let added = 0, failed = 0;
  for(const name of take){
    setStatus(`Adding ${added + failed + 1} of ${take.length}…`);
    try { await QFCCustomers.save({ name }); added++; } catch(e){ failed++; }
  }
  btn.disabled = false;
  setStatus(`Added ${added.toLocaleString()} customer${added === 1 ? '' : 's'}` + (failed ? `; ${failed} couldn't be added.` : '.'));
}

function setStatus(text){ document.getElementById('status').textContent = text || ''; }

function showGate(kind){
  const gate = document.getElementById('gate');
  gate.innerHTML = kind === 'signin'
    ? `<h2>Sign in to see your customers</h2><p>The customer list is part of your QuickFreightCalc account.</p><a class="btn primary" href="/signup.html?login">Sign in</a>`
    : `<h2>The customer list comes with Pro Plus</h2>
       <ul>
         <li>Save customers once, with contact, email, phone and address.</li>
         <li>Pick them on the calculator, multi-stop or bulk page; their details print under “Prepared for” on your PDFs.</li>
         <li>Give a customer a default margin, used when you pick them.</li>
         <li>See each customer's quotes, wins and losses.</li>
       </ul>
       <p>Pro Plus is $19.99/month and also includes win/loss tracking and 1,000 saved quotes.</p>
       ${kind === 'upgrade'
         ? '<a class="btn primary" href="/profile.html#subscription-paid">Change plan</a>'
         : '<a class="btn primary" href="/signup.html?plan=plus">Get Pro Plus</a>'}`;
  gate.hidden = false;
}

(async function init(){
  if(!session()){ showGate('signin'); return; }
  await QFCCustomers.ready();
  const tier = QFCCustomers.tier();
  if(!QFCCustomers.allowed()){ showGate(tier === 'none' ? 'join' : 'upgrade'); return; }
  document.getElementById('app').hidden = false;
  render();
  try { await loadQuotes(); } catch(e){}
  render();
  QFCCustomers.onChange(render);
  document.getElementById('search').addEventListener('input', (e) => { query = e.target.value; render(); });
  document.getElementById('add-btn').addEventListener('click', () => QFCCustomers.openEditor({ name: query.trim() }));
  document.getElementById('import-btn').addEventListener('click', importFromQuotes);
  document.getElementById('rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if(tr) QFCCustomers.openEditor(QFCCustomers.byId(tr.dataset.id));
  });
})();
</script>
</body>
</html>
